<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozinha - Gás & Água</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 20px; }
        
        /* Estilo do Card de Pedido */
        .card {
            background: white;
            border-left: 5px solid #25D366; /* Verde WhatsApp */
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 15px;
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-5px); }
        .card-header { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
        .pedido-id { font-weight: bold; color: #555; }
        .hora { color: #888; font-size: 0.9em; }
        .item-destaque { font-size: 1.4em; font-weight: bold; color: #333; margin: 10px 0; }
        .detalhe { margin: 5px 0; color: #666; }
        .pagamento { background: #e8f5e9; color: #2e7d32; padding: 5px 10px; border-radius: 15px; font-size: 0.8em; display: inline-block; margin-top: 10px; }
        .endereco { background: #fff3e0; color: #e65100; padding: 8px; border-radius: 5px; margin-top: 10px; font-weight: 500;}
        
        /* Animação de entrada */
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .novo { animation: slideIn 0.5s ease-out; }
    </style>
</head>
<body>

    <h1>🖥️ Painel de Pedidos em Tempo Real</h1>
    <div id="lista-pedidos" class="grid">
        <p style="text-align:center; width:100%; color:#888;">Aguardando pedidos...</p>
    </div>

    <script>
        // Função que busca os dados no servidor
        async function atualizarPedidos() {
            try {
                const response = await fetch('/api/pedidos');
                const pedidos = await response.json();
                
                const container = document.getElementById('lista-pedidos');
                
                // Se não houver pedidos, não faz nada
                if (pedidos.length === 0) return;

                // Limpa a tela para redesenhar (jeito simples)
                container.innerHTML = '';

                pedidos.forEach(p => {
                    const dataFormatada = new Date(p.data_pedido).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
                    
                    // Cria o HTML do Card
                    const card = document.createElement('div');
                    card.className = 'card novo';
                    card.innerHTML = `
                        <div class="card-header">
                            <span class="pedido-id">#${p.id} - ${p.cliente_nome}</span>
                            <span class="hora">🕒 ${dataFormatada}</span>
                        </div>
                        <div class="item-destaque">
                            ${p.quantidade}x ${p.item}
                        </div>
                        <div class="endereco">
                            📍 ${p.endereco}
                        </div>
                        <div class="detalhe">📞 ${p.cliente_telefone}</div>
                        <div class="pagamento">💰 ${p.metodo_pagamento} - R$ ${p.valor_total},00</div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("Erro ao buscar pedidos:", error);
            }
        }

        // Atualiza a cada 3 segundos
        setInterval(atualizarPedidos, 3000);
        atualizarPedidos(); // Chama a primeira vez na hora
    </script>
</body>
</html>
